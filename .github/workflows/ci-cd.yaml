name: CI/CD Pipeline Expensy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/expensy-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/expensy-frontend
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: expensy-eks-cluster

jobs:
  # ==========================================
  # STAGE 1: BUILD & TEST (Frontend & Backend)
  # ==========================================
  build-and-test:
    name: Build & Test Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            expensy_backend/package-lock.json
            expensy_frontend/package-lock.json

      # --- Backend ---
      - name: Install & Build Backend
        run: |
          cd expensy_backend
          npm ci
          npm run build

      - name: Test Backend
        run: |
          cd expensy_backend
          # Exécute les tests unitaires s'ils existent, sinon continue
          npm test || echo "Aucun test unitaire configuré pour le backend"

      # --- Frontend ---
      - name: Install & Build Frontend
        run: |
          cd expensy_frontend
          npm ci
          npm run build

      - name: Test Frontend
        run: |
          cd expensy_frontend
          npm test || echo "Aucun test unitaire configuré pour le frontend"

  # ==========================================
  # STAGE 2: DOCKER BUILD & PUSH (Docker Hub)
  # ==========================================
  docker-build-push:
    name: Docker Build & Push
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./expensy_backend
          file: ./expensy_backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # Build & Push Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./expensy_frontend
          file: ./expensy_frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # ==========================================
  # STAGE 3: DEPLOY TO EKS (Manual Approval)
  # ==========================================
  deploy-eks:
    name: Deploy to EKS Cluster
    needs: docker-build-push
    runs-on: ubuntu-latest
    # Requis pour l'approbation manuelle
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy Manifests & Rollout Restart
        run: |
          # Mise à jour des manifests ou réplication des nouveaux déploiements
          kubectl apply -f k8s/ || true
          
          # Force le déploiement des nouvelles images
          kubectl rollout restart deployment/expensy-backend -n default
          kubectl rollout restart deployment/expensy-frontend -n default
          
          # Vérification du statut du déploiement
          kubectl rollout status deployment/expensy-backend -n default --timeout=120s
          kubectl rollout status deployment/expensy-frontend -n default --timeout=120s
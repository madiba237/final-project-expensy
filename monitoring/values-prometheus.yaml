# monitoring/values-prometheus.yaml

grafana:
  enabled: true
  adminPassword: AdminPassword123! # À modifier selon vos besoins
  service:
    type: LoadBalancer # Permet d'accéder à Grafana directement via une URL AWS ELB
    annotations:
      # Force la création d'un Load Balancer public accessible depuis Internet
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: expensy-dashboards
          orgId: 1
          folder: Expensy
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/expensy
  dashboardsConfigMaps:
    expensy-dashboards: expensy-grafana-dashboard

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false